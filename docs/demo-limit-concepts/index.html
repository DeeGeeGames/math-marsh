<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Marsh · Demo concepts</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Trebuchet MS',Arial,sans-serif;color:var(--foreground,#fff7c6)}button,a{font:inherit}button{cursor:pointer} .review{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.review button{border:1px solid var(--border,#637b79);background:var(--secondary,#244b50);color:inherit;padding:10px 14px;border-radius:10px}.review button[aria-pressed=true]{border-color:#f4d27a;color:#f4d27a}.note{font-size:14px;line-height:1.5;color:var(--muted-foreground,#b6c9c6);margin:12px 0 18px}.game{--cream:#fff7c6;--gold:#f4d27a;--green:#9bd45e;position:relative;isolation:isolate;color:var(--cream);background:radial-gradient(ellipse at 20% 0%,#5fc3c3 0%,transparent 58%),linear-gradient(#278c99,#0f4f62);padding:36px 24px;border-radius:20px;overflow:hidden;min-height:650px;display:grid;align-content:center}.game:before{content:'';position:absolute;inset:0;z-index:-1;opacity:.25;background:radial-gradient(ellipse at 12% 30%,transparent 35px,#fff7c6 36px 38px,transparent 39px),radial-gradient(ellipse at 86% 70%,transparent 65px,#fff7c6 66px 68px,transparent 69px)}.panel{background:linear-gradient(135deg,rgba(15,79,98,.96),rgba(8,73,82,.96));border:2px solid #f4d27a57;border-radius:24px;padding:32px;width:min(100%,1024px);margin:auto;box-shadow:0 10px 22px #051f244d}.center{text-align:center;max-width:700px;padding:44px 36px}h1{font-size:clamp(30px,4vw,52px);color:var(--gold);line-height:1.08;margin:12px 0 18px}h2{font-size:26px;margin:8px 0}p{line-height:1.5}.lead{font-size:clamp(20px,2vw,27px);margin:12px auto;max-width:550px}.sub{font-size:18px;color:#d8e9dd}.eyebrow{font-size:15px;text-transform:uppercase;letter-spacing:.14em;color:#e0ede2;font-weight:bold}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:2px solid #fff7c650;border-radius:16px;min-height:56px;padding:14px 22px;color:#fff7c6;font-weight:bold;background:linear-gradient(135deg,#3e7d6b,#1c5361)}.primary{background:linear-gradient(135deg,#9bd45e,#4b9f3b 58%,#246b35);color:#102e1d}.actions{display:grid;gap:12px;margin:28px auto 0;max-width:420px}.score{font-size:28px;color:#9bd45e;margin:24px 0}.mobile .panel:not(.art-ending){padding:20px}.mobile .game{padding:16px}.mobile h1{font-size:32px}.mobile .lead{font-size:21px}.mobile .center{padding:28px 20px}.viewport{margin:auto;width:100%}.viewport.mobile{max-width:390px}.viewport.mobile .game{min-height:720px}.features{padding:18px;background:#02283666;border-radius:14px;margin-top:24px;font-size:18px;line-height:1.6}.features p{margin:0} @media(max-width:600px){.game{padding:16px;min-height:600px}.panel{padding:20px}.center{padding:30px 20px}.sub{font-size:16px}}
.art-ending{padding:0;overflow:hidden;max-width:1000px}.key-art{display:block;width:100%;height:auto}.ending-body{padding:28px 32px 32px;text-align:center}.ending-body h1{font-size:clamp(28px,3.5vw,42px);margin:8px 0 12px}.ending-body .lead{font-size:22px}.ending-body .features{margin:20px auto 0;max-width:620px}.ending-body .actions{max-width:760px;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:24px}.ending-body .btn{padding-inline:12px}.ending-body .sub{margin-bottom:0}.mobile .ending-body{padding:24px 20px}.mobile .ending-body .actions{grid-template-columns:1fr}.mobile .ending-body .lead{font-size:20px}@media(max-width:600px){.ending-body{padding:24px 20px}.ending-body .actions{grid-template-columns:1fr}.ending-body .lead{font-size:20px}}
@media(max-width:600px){.ending-body{padding:20px 18px}.ending-body h1{font-size:28px}.ending-body .lead{margin:8px auto;font-size:20px}.ending-body .sub{font-size:16px}.ending-body .features{font-size:16px;line-height:1.4;margin-top:14px;padding:12px}.ending-body .actions{gap:8px;margin-top:18px}.ending-body .btn{min-height:50px;padding-block:10px}}
.btn:focus-visible,.review button:focus-visible{outline:4px solid #fff7c6;outline-offset:4px}
</style>
<body>
<nav class="review" aria-label="Mockup screens">
<button data-scene="end" aria-pressed="true">Demo ending</button><button data-scene="results" aria-pressed="false">Final Arcade result</button>
</nav>
<div class="review" aria-label="Preview width"><button id="wide" aria-pressed="true">Wide</button><button id="phone" aria-pressed="false">Phone</button></div>
<div id="viewport" class="viewport"><main id="game" class="game" aria-label="Math Marsh demo concept"></main></div>
<p id="annotation" class="note"></p>
<script>
const game=document.getElementById('game');const viewport=document.getElementById('viewport');let scene='end';
const button=(text,action,primary=false)=>`<button class="btn ${primary?'primary':''}" data-action="${action}">${text}</button>`;
const store='<a class="btn primary" href="https://store.steampowered.com/app/4927380/" target="_blank" rel="noopener">View full game</a>';
function render(){document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));let markup='';let note='';
if(scene==='end'){markup=`<section class="panel art-ending"><img class="key-art" src="../../src/assets/marketing/math-marsh-splash.jpg" alt="Math Marsh: a frog, lizard, spider, and fly on a sunny pond"><div class="ending-body"><span class="eyebrow">Demo complete</span><h1>There’s more beyond this pond</h1><p class="lead">You’ve completed all five rounds of the Arcade demo.</p><p class="sub">Keep hopping in the full version of Math Marsh.</p><div class="features"><p>Continue Arcade beyond round five</p></div><div class="actions">${store}${button('Play again','replay')}${button('Main menu','menu')}</div><p class="sub">Replay the demo as often as you like.</p></div></section>`;note='Revised scope: every demo Arcade run ends after five pond levels. Replays are unlimited, including within the same launch. Complete round five → normal results → Continue → this screen. The original Steam splash artwork is displayed in full, without cropping.';}
if(scene==='results'){markup=`<section class="panel center"><span class="eyebrow">Arcade</span><h1>Nice hopping!</h1><p class="lead">Your demo run is complete.</p><div class="score">5 rounds cleared · 30 equations solved</div><div class="actions">${button('Continue','end',true)}${button('Main menu','menu')}</div></section>`;note='Illustrative result values. Completing the fifth pond level ends this run and opens its results. Continue leads to the full-game interstitial. There is no launch-wide run allowance.';}
if(scene==='replay'){markup=`<section class="panel center"><span class="eyebrow">Arcade · Fresh demo run</span><h1>Back to the pond</h1><p class="lead">A new five-round run starts here.</p><p class="sub">Choose your operations and pond using the existing Arcade setup.</p><div class="actions">${button('Preview round-five results','results',true)}${button('Main menu','menu')}</div></section>`;note='Prototype placeholder for existing Arcade setup and gameplay. Every Play Again starts a new run. A loss before round five keeps the normal results and replay flow.';}
if(scene==='menu'){markup=`<section class="panel center"><span class="eyebrow">Demo</span><h1>Math Marsh</h1><p class="lead">Choose your next hop.</p><div class="actions">${button('Arcade','replay',true)}</div></section>`;note='Placeholder for the existing main menu. Arcade always starts a fresh five-round demo run. Practice is unchanged and is not part of this mockup.';}
game.innerHTML=markup;document.getElementById('annotation').textContent=note;}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.scene){scene=b.dataset.scene;render();return}if(b.id==='phone'||b.id==='wide'){const mobile=b.id==='phone';viewport.classList.toggle('mobile',mobile);document.getElementById('phone').setAttribute('aria-pressed',String(mobile));document.getElementById('wide').setAttribute('aria-pressed',String(!mobile));return}if(b.dataset.action){scene=b.dataset.action;render();}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){scene='menu';render();}});
render();
console.log('Layout check', {width:document.documentElement.clientWidth, horizontalOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth});
</script>
</body>
</html>
