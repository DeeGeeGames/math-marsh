name: Steam Deployment

on:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      build_description:
        description: Build description shown in Steamworks.
        required: true
        default: manual-build
      release_branch:
        description: Steam branch to deploy to.
        required: true
        default: prerelease

      input_diagnostics:
        description: Deploy the native Steam Input test instead of the game (test branches only).
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: steam-${{ inputs.release_branch || 'prerelease' }}
  cancel-in-progress: false

jobs:
  build_desktop:
    if: ${{ !inputs.input_diagnostics || (inputs.release_branch != 'default' && inputs.release_branch != '') }}
    uses: ./.github/workflows/build-desktop.yml
    with:
      input-diagnostics: ${{ inputs.input_diagnostics || false }}

  deploy_steam:
    needs: build_desktop
    uses: ./.github/workflows/deploy-steam.yml
    with:
      build_description: ${{ inputs.build_description || format('push-{0}', github.sha) }}
      release_branch: ${{ inputs.release_branch || 'prerelease' }}
    secrets: inherit
