name: Build Desktop

on:
  workflow_call:
    inputs:
      version:
        description: Version to set in package.json. A leading v is stripped.
        type: string
        default: ''
      is-release:
        description: Upload installer/archive release artifacts in addition to Steam depots.
        type: boolean
        default: false

      input-diagnostics:
        description: Package the standalone Steam Input diagnostic.
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            package_script: desktop:package:linux
            release_artifact_name: desktop-linux
            release_artifact_path: |
              desktop-dist/*.AppImage
            steam_artifact_name: steam-linux
            steam_artifact_path: desktop-dist/linux-unpacked
          - os: windows-latest
            platform: windows
            package_script: desktop:package:win
            release_artifact_name: desktop-windows
            release_artifact_path: |
              desktop-dist/*.exe
              desktop-dist/*.zip
            steam_artifact_name: steam-windows
            steam_artifact_path: desktop-dist/win-unpacked
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync package.json version
        if: inputs.version != ''
        run: bun pm pkg set version="${VERSION#v}"
        shell: bash
        env:
          VERSION: ${{ inputs.version }}

      - name: Configure SDK download credentials
        if: inputs.input-diagnostics
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download Steamworks SDK
        if: inputs.input-diagnostics
        shell: bash
        env:
          SDK_URI: ${{ vars.STEAM_SDK_S3_URI }}
        run: |
          aws s3 cp "$SDK_URI" steamworks_sdk.tar.gz
          tar xzf steamworks_sdk.tar.gz

      - name: Package desktop (${{ matrix.platform }})
        if: ${{ !inputs.input-diagnostics }}
        run: bun run ${{ matrix.package_script }}

      - name: Package Steam Input diagnostic
        if: inputs.input-diagnostics
        shell: bash
        run: |
          bun run typecheck
          bun run scripts/build-steam-input-diagnostics.ts
          bun x electron-builder --${{ matrix.platform == 'windows' && 'win' || 'linux' }} --dir --config electron/steam-input-builder.cjs
          if [ "${{ matrix.platform }}" = "windows" ]; then bun run scripts/steam-windows-executable.ts; fi

      - name: Upload release artifacts
        if: inputs.is-release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release_artifact_name }}
          path: ${{ matrix.release_artifact_path }}
          if-no-files-found: error

      - name: Upload unpacked build for Steam
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.steam_artifact_name }}
          path: ${{ matrix.steam_artifact_path }}
          if-no-files-found: error
